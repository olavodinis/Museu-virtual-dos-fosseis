      // 1. Icon Wrapper Component for Lucide Icons
      function Icon({ name, className = "w-4 h-4", ...props }) {
        const ref = useRef(null);
        useEffect(() => {
          if (ref.current) {
            ref.current.innerHTML = '';
            const iconEl = document.createElement('i');
            iconEl.setAttribute('data-lucide', name);
            iconEl.className = className;
            ref.current.appendChild(iconEl);
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
              window.lucide.createIcons();
            }
          }
        }, [name, className]);
        return <span ref={ref} className="inline-flex items-center justify-center" {...props} />;

      // 2. 3D Procedural Canvas using Three.js UMD
      function FossilCanvas3D({ fossilType, color, wearFactor, size, ridges, fossilName }) {
        const mountRef = useRef(null);
        const canvasRef = useRef(null);
        const [lightMode, setLightMode] = useState('museum');
        const [renderStyle, setRenderStyle] = useState('realistic');
        const [showRuler, setShowRuler] = useState(false);
        const [fissuresActive, setFissuresActive] = useState(false);
        const [isRotating, setIsRotating] = useState(true);

        const zoomFactorRef = useRef(1.0);
        const rotationActiveRef = useRef(isRotating);

        useEffect(() => {
          rotationActiveRef.current = isRotating;
        }, [isRotating]);

        useEffect(() => {
          const container = mountRef.current;
          const canvas = canvasRef.current;
          if (!container || !canvas) return;

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x0f1110);

          const w = container.clientWidth || 400;
          const h = container.clientHeight || 340;
          const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
          camera.position.set(0, 0, 8);

          const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
          renderer.setSize(w, h);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.shadowMap.enabled = true;

          const lightGroup = new THREE.Group();
          scene.add(lightGroup);

          const updateLights = () => {
            while(lightGroup.children.length > 0) lightGroup.remove(lightGroup.children[0]);
            if (lightMode === 'museum') {
              lightGroup.add(new THREE.AmbientLight(0x0b132b, 1.5));
              const spot = new THREE.SpotLight(0xfff3e0, 18);
              spot.position.set(3, 5, 4);
              spot.angle = Math.PI / 6;
              spot.castShadow = true;
              lightGroup.add(spot);
            } else if (lightMode === 'studio') {
              lightGroup.add(new THREE.AmbientLight(0xffffff, 1.8));
              const key = new THREE.DirectionalLight(0xffffff, 4.0);
              key.position.set(5, 5, 5);
              lightGroup.add(key);
            } else {
              lightGroup.add(new THREE.AmbientLight(0xdff0ff, 1.2));
              const sun = new THREE.DirectionalLight(0xfffaed, 5.0);
              sun.position.set(6, 8, 3);
              lightGroup.add(sun);
            }
          };
          updateLights();

          const fossilGroup = new THREE.Group();
          scene.add(fossilGroup);

          const baseColor = new THREE.Color(color);
          let mat;
          if (renderStyle === 'wireframe') {
            mat = new THREE.MeshBasicMaterial({ color: baseColor, wireframe: true });
          } else if (renderStyle === 'xray') {
            mat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00a8cc, emissiveIntensity: 0.8, transparent: true, opacity: 0.5, wireframe: true, side: THREE.DoubleSide });
          } else {
            if (fossilType === 'AMBER_INSECT') {
              mat = new THREE.MeshPhysicalMaterial({ color: 0xffaa00, roughness: 0.1, metalness: 0.1, transmission: 0.9, thickness: 1.5, ior: 1.5 });
            } else {
              mat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.8 - wearFactor * 0.4, metalness: 0.1, flatShading: true });
            }
          }

          const buildModel = () => {
            const inner = new THREE.Group();
            fossilGroup.add(inner);

            if (fossilType === 'AMMONITE') {
              const chambers = Math.round(ridges);
              for (let i = 0; i < chambers; i++) {
                const t = i / (chambers - 1);
                const theta = t * Math.PI * 4.2;
                const r = 0.08 * Math.exp(0.16 * theta);
                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);
                const radius = 0.06 + r * 0.28;
                const torus = new THREE.Mesh(new THREE.TorusGeometry(radius, radius * 0.45, 8, 16), mat);
                torus.position.set(x, y, 0);
                torus.rotation.z = theta + Math.PI / 2;
                inner.add(torus);
              }
            } else if (fossilType === 'TRILOBITE') {
              const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 12), mat);
              head.scale.set(1.4, 0.8, 0.6);
              head.position.set(0, 0.9, 0);
              inner.add(head);

              const segments = Math.round(ridges/2) + 4;
              for (let i = 0; i < segments; i++) {
                const ratio = i / (segments - 1);
                const y = 0.4 - ratio * 1.5;
                const wScale = 1.0 - ratio * 0.4;
                const segment = new THREE.Mesh(new THREE.CylinderGeometry(0.2*wScale, 0.2*wScale, 0.12, 12), mat);
                segment.rotation.x = Math.PI / 2;
                segment.position.set(0, y, 0.1);
                inner.add(segment);
              }
            } else if (fossilType === 'MEGALODON_TOOTH') {
              const shape = new THREE.Shape();
              shape.moveTo(-1.0, 0);
              shape.bezierCurveTo(-0.8, 1.0, -0.3, 1.8, 0, 2.5);
              shape.bezierCurveTo(0.3, 1.8, 0.8, 1.0, 1.0, 0);
              shape.lineTo(0.9, -0.2);
              shape.bezierCurveTo(0.5, -0.4, -0.5, -0.4, -0.9, -0.2);
              const extrude = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.25, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05 }), mat);
              extrude.center();
              inner.add(extrude);
            } else if (fossilType === 'LEAF_IMPRINT') {
              const slab = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3.2, 0.2), renderStyle === 'realistic' ? new THREE.MeshStandardMaterial({ color: 0x766d62, roughness: 0.95 }) : mat);
              inner.add(slab);
              const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 8), mat);
              stem.position.set(0, 0, 0.11);
              inner.add(stem);
            } else if (fossilType === 'AMBER_INSECT') {
              const gem = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 16), mat);
              gem.scale.set(1.0, 1.3, 0.8);
              inner.add(gem);
              const bug = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshStandardMaterial({ color: 0x110d0a }));
              bug.scale.set(0.6, 1.5, 0.6);
              bug.position.set(0, 0, 0.1);
              inner.add(bug);
            } else {
              const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 2.0, 12), mat);
              inner.add(shaft);
              const joint = new THREE.SphereGeometry(0.4, 12, 12);
              const t1 = new THREE.Mesh(joint, mat); t1.position.set(-0.25, 1.0, 0); inner.add(t1);
              const t2 = new THREE.Mesh(joint, mat); t2.position.set(0.25, 1.0, 0); inner.add(t2);
              const b1 = new THREE.Mesh(joint, mat); b1.position.set(-0.25, -1.0, 0); inner.add(b1);
              const b2 = new THREE.Mesh(joint, mat); b2.position.set(0.25, -1.0, 0); inner.add(b2);
            }

            inner.scale.set(size, size, size);
          };
          buildModel();

          let isMouseDown = false;
          let prevMouseX = 0, prevMouseY = 0;

          const onDown = (e) => { isMouseDown = true; prevMouseX = e.clientX || e.touches[0].clientX; prevMouseY = e.clientY || e.touches[0].clientY; };
          const onMove = (e) => {
            if (!isMouseDown) return;
            const cx = e.clientX || e.touches?.[0]?.clientX;
            const cy = e.clientY || e.touches?.[0]?.clientY;
            if (cx === undefined || cy === undefined) return;
            const dx = cx - prevMouseX;
            const dy = cy - prevMouseY;
            prevMouseX = cx; prevMouseY = cy;
            fossilGroup.rotation.y += dx * 0.01;
            fossilGroup.rotation.x += dy * 0.01;
          };
          const onUp = () => { isMouseDown = false; };

          canvas.addEventListener('mousedown', onDown);
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
          canvas.addEventListener('touchstart', onDown, { passive: true });
          canvas.addEventListener('touchmove', onMove, { passive: true });
          window.addEventListener('touchend', onUp);

          let animId;
          const clock = new THREE.Clock();
          const animate = () => {
            animId = requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            if (rotationActiveRef.current && !isMouseDown) {
              fossilGroup.rotation.y = elapsed * 0.2;
              fossilGroup.position.y = Math.sin(elapsed * 1.5) * 0.1;
            }
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, 8 / zoomFactorRef.current, 0.1);
            renderer.render(scene, camera);
          };
          animate();

          const observer = new ResizeObserver(() => {
            const nw = container.clientWidth || 400;
            const nh = container.clientHeight || 340;
            camera.aspect = nw / nh;
            camera.updateProjectionMatrix();
            renderer.setSize(nw, nh);
          });
          observer.observe(container);

          return () => {
            cancelAnimationFrame(animId);
            observer.disconnect();
            canvas.removeEventListener('mousedown', onDown);
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            canvas.removeEventListener('touchstart', onDown);
            canvas.removeEventListener('touchmove', onMove);
            window.removeEventListener('touchend', onUp);
            renderer.dispose();
          };
        }, [fossilType, color, wearFactor, size, ridges, lightMode, renderStyle, showRuler, fissuresActive]);

        return (
          <div className="relative w-full h-full flex flex-col bg-[#0F1110] rounded-2xl overflow-hidden border border-[#C2A26E]/20 shadow-2xl group/canvas" id="canvas-container">
            <div ref={mountRef} className="relative flex-grow w-full h-full min-h-[320px] cursor-grab active:cursor-grabbing">
              <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block" id="three-fossil-canvas" />
              <div className="absolute top-4 left-4 bg-black/80 border border-gold/30 rounded-lg p-2.5">
                <span className="text-[10px] font-mono text-gold block uppercase tracking-wider">Modo de Exploração</span>
                <span className="text-sm font-serif italic text-white block">{fossilName}</span>
              </div>
            </div>

            <div className="p-2.5 bg-[#141615] border-t border-gold/20 flex flex-wrap gap-2 items-center justify-between">
              <div className="flex gap-1 bg-[#0F1110] rounded-lg p-1 border border-gold/15">
                <button onClick={() => setLightMode('museum')} className={`p-1.5 rounded ${lightMode === 'museum' ? 'bg-gold/20 text-gold' : 'text-slate-500'}`} title="Luz Museu"><Icon name="lightbulb" /></button>
                <button onClick={() => setLightMode('studio')} className={`p-1.5 rounded ${lightMode === 'studio' ? 'bg-gold/20 text-white' : 'text-slate-500'}`} title="Luz Estúdio"><Icon name="activity" /></button>
              </div>

              <div className="flex gap-1 bg-[#0F1110] rounded-lg p-1 border border-gold/15">
                {['realistic', 'xray', 'wireframe'].map(st => (
                  <button key={st} onClick={() => setRenderStyle(st)} className={`px-2 py-0.5 text-[9px] font-mono uppercase rounded ${renderStyle === st ? 'bg-gold/20 text-gold' : 'text-slate-500'}`}>{st === 'realistic' ? 'Real' : st === 'xray' ? 'X-Ray' : 'Malha'}</button>
                ))}
              </div>

              <div className="flex items-center gap-1">
                <button onClick={() => setIsRotating(!isRotating)} className={`p-1 rounded ${isRotating ? 'bg-gold/10 text-gold' : 'text-slate-500'}`}><Icon name="rotate-cw" /></button>
                <button onClick={() => zoomFactorRef.current = Math.min(2.5, zoomFactorRef.current + 0.25)} className="p-1 rounded text-slate-400"><Icon name="zoom-in" /></button>
                <button onClick={() => zoomFactorRef.current = Math.max(0.4, zoomFactorRef.current - 0.25)} className="p-1 rounded text-slate-400"><Icon name="zoom-out" /></button>
              </div>
            </div>
          </div>
        );
      }

      // 4. Register Fossil Upload Curation Wizard
      function AddFossilModal({ onClose, onSave }) {
        const [step, setStep] = useState(1);
        const [loadingAI, setLoadingAI] = useState(false);
        const [aiMsg, setAiMsg] = useState(null);

        // State
        const [fossilName, setFossilName] = useState('');
        const [groupName, setGroupName] = useState('');
        const [geologicEra, setGeologicEra] = useState('Mesozoico');
        const [age, setAge] = useState('');
        const [location, setLocation] = useState('');
        const [description, setDescription] = useState('');

        const [fossilType, setFossilType] = useState('AMMONITE');
        const [color, setColor] = useState('#8a8885');
        const [wearFactor, setWearFactor] = useState(0.2);
        const [size, setSize] = useState(1.0);
        const [ridges, setRidges] = useState(16);

        const [scientificFacts, setScientificFacts] = useState(['', '', '', '']);
        const [fossilizationProcess, setFossilizationProcess] = useState(['', '', '', '', '']);
        const [curiosities, setCuriosities] = useState(['', '', '']);

        const [quizQuestions, setQuizQuestions] = useState([{ question: '', options: ['', '', '', ''], answerIndex: 0, explanation: '' }]);

        const triggerAI = async () => {
          if (!fossilName.trim()) {
            setAiMsg('Escreve o nome do fóssil para iniciarmos a curadoria!');
            return;
          }
          setLoadingAI(true);
          setAiMsg(null);
          try {
            const res = await fetch('/api/curate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ fossilName })
            });
            if (!res.ok) throw new Error();
            const d = await res.json();
            setFossilName(d.fossilName || fossilName);
            setGeologicEra(d.geologicEra || geologicEra);
            setAge(d.age || '');
            setLocation(d.location || '');
            setDescription(d.description || '');
            setFossilType(d.fossilType || 'AMMONITE');
            setColor(d.color || '#8a8885');
            if (d.scientificFacts) setScientificFacts(d.scientificFacts);
            if (d.fossilizationProcess) setFossilizationProcess(d.fossilizationProcess);
            if (d.curiosities) setCuriosities(d.curiosities);
            if (d.quizQuestions) setQuizQuestions(d.quizQuestions);
            setAiMsg('✨ Conteúdo gerado pela IA com sucesso!');
          } catch {
            // Local algorithmic fallback
            const fallback = generateClientSideCuration(fossilName);
            setFossilName(fallback.fossilName);
            setGeologicEra(fallback.geologicEra);
            setAge(fallback.age);
            setLocation(fallback.location);
            setDescription(fallback.description);
            setFossilType(fallback.fossilType);
            setColor(fallback.color);
            setScientificFacts(fallback.scientificFacts);
            setFossilizationProcess(fallback.fossilizationProcess);
            setCuriosities(fallback.curiosities);
            setQuizQuestions(fallback.quizQuestions);
            setAiMsg('🤖 Preenchido via gerador científico do laboratório local!');
          } finally {
            setLoadingAI(false);
          }
        };

        const handleSave = () => {
          if (!fossilName || !groupName || !age || !location || !description) {
            alert('Preenche os dados básicos do Passo 1!');
            setStep(1);
            return;
          }
          onSave({
            fossilName, groupName, geologicEra, age, location, description,
            fossilType, color, wearFactor, size, ridges,
            scientificFacts: scientificFacts.filter(f => f.trim() !== ''),
            fossilizationProcess: fossilizationProcess.filter(p => p.trim() !== ''),
            curiosities: curiosities.filter(c => c.trim() !== ''),
            quizQuestions: quizQuestions.filter(q => q.question.trim() !== '')
          });

        return (
          <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">

                <button onClick={onClose} className="p-1 hover:bg-slate-800 rounded text-slate-400"><Icon name="x" /></button>
              </div>

                {[
                  { s: 1, n: 'Campo' }, { s: 2, n: 'Investigação' }, { s: 3, n: 'Quiz' }, { s: 4, n: 'Escultura 3D' }
                ].map(stepObj => (
                  <button key={stepObj.s} onClick={() => setStep(stepObj.s)} className={`px-4 py-2 border-b-2 ${step === stepObj.s ? 'border-gold text-gold font-bold' : 'border-transparent text-slate-500'}`}>{stepObj.s}. {stepObj.n}</button>

                        <label className="block text-slate-400 mb-1">Geometria Fóssil</label>
                        <div className="grid grid-cols-3 gap-2">
                          {['AMMONITE', 'TRILOBITE', 'MEGALODON_TOOTH', 'LEAF_IMPRINT', 'AMBER_INSECT', 'DINOSAUR_BONE'].map(t => (
                            <button key={t} type="button" onClick={() => setFossilType(t)} className={`p-2 rounded border text-[10px] uppercase font-mono ${fossilType === t ? 'bg-gold/15 border-gold text-gold' : 'bg-slate-900 border-gold/10 text-slate-500'}`}>{t.replace('_', ' ')}</button>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3 pt-2">
                        <div>
                          <label className="block text-slate-400 mb-1">Cor</label>
                          <input type="color" value={color} onChange={e => setColor(e.target.value)} className="w-full h-8 bg-transparent border-0 cursor-pointer p-0" />
                        </div>
                        <div>
                          <label className="block text-slate-400 mb-1">Erosão/Desgaste ({(wearFactor*100).toFixed(0)}%)</label>
                          <input type="range" min="0" max="1" step="0.1" value={wearFactor} onChange={e => setWearFactor(parseFloat(e.target.value))} className="w-full h-2 bg-slate-900 rounded cursor-pointer" />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-slate-400 mb-1">Tamanho ({size.toFixed(1)}x)</label>
                          <input type="range" min="0.5" max="2" step="0.1" value={size} onChange={e => setSize(parseFloat(e.target.value))} className="w-full h-2 bg-slate-900 rounded cursor-pointer" />
                        </div>
                        <div>
                          <label className="block text-slate-400 mb-1">Segmentação ({ridges})</label>
                          <input type="range" min="6" max="36" step="2" value={ridges} onChange={e => setRidges(parseInt(e.target.value))} className="w-full h-2 bg-slate-900 rounded cursor-pointer" />
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div className="p-4 bg-[#141615] border-t border-gold/10 flex justify-between">
                <button disabled={step === 1} onClick={() => setStep(step - 1)} className="px-4 py-2 border border-gold/30 rounded-lg text-xs text-slate-300 disabled:opacity-30">Anterior</button>
                <div className="flex gap-2">
                  <button onClick={onClose} className="px-4 py-2 text-slate-400 text-xs">Cancelar</button>
                  {step < 4 ? (
                    <button onClick={() => setStep(step + 1)} className="px-4 py-2 bg-slate-900 border border-gold/30 text-white text-xs rounded-lg">Seguinte</button>
                  ) : (
                    <button onClick={handleSave} className="px-6 py-2 bg-white hover:bg-gold text-black text-xs rounded-lg font-bold">Publicar Obra</button>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      // 5. Main Museum Portal/Lobby
      function MuseumAtrium({ exhibits, onSelect, onOpenAdd, user, onGoogleSignIn, onGuestSignIn, onSignOut }) {
        const [search, setSearch] = useState('');
        const [eraFilter, setEraFilter] = useState('all');
        const [sort, setSort] = useState('newest');
        const [guestName, setGuestName] = useState('');
        const [showGuest, setShowGuest] = useState(false);

        const filtered = useMemo(() => {
          return exhibits
            .filter(ex => {
              const matchText = ex.fossilName.toLowerCase().includes(search.toLowerCase()) || ex.groupName.toLowerCase().includes(search.toLowerCase());
              const matchEra = eraFilter === 'all' || ex.geologicEra === eraFilter;
              return matchText && matchEra;
            })
            .sort((a, b) => {
              if (sort === 'popular') return b.likesCount - a.likesCount;
              return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
            });
        }, [exhibits, search, eraFilter, sort]);

        const totalSpecimens = exhibits.length;
        const totalLikes = exhibits.reduce((sum, curr) => sum + curr.likesCount, 0);
        const distinctGroups = new Set(exhibits.map(ex => ex.groupName)).size;

        return (
          <div className="w-full max-w-7xl mx-auto px-4 md:px-6 py-4 space-y-6 animate-fadeIn" id="museum-atrium-root">
            <div className="relative rounded-2xl overflow-hidden border border-gold/20 bg-gradient-to-br from-[#141615] to-[#1a1c1b] p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-6" id="museum-hero-banner">
              <div className="space-y-3 max-w-xl text-center md:text-left z-10">
                <span className="inline-flex gap-1 bg-gold/10 border border-gold/30 text-[10px] font-mono text-gold px-3 py-0.5 rounded-full uppercase tracking-wider"><Icon name="landmark" /> Galeria Paleontológica</span>
                <h1 className="text-2xl md:text-4xl font-serif italic text-white leading-none">Museu Virtual <span className="bg-gradient-to-r from-gold via-amber-100 to-gold bg-clip-text text-transparent not-italic font-bold">dos Fósseis</span></h1>
                <p className="text-slate-400 text-xs md:text-sm leading-relaxed">Explora alguns fósseis criados em 3D e curados por equipas de estudantes de Ciências Naturais! Analisa factos científicos, responde aos testes práticos e regista a tua descoberta!</p>
              </div>

              <div className="grid grid-cols-3 gap-3 w-full md:w-auto max-w-sm z-10 font-mono text-center">
                <div className="p-3 bg-[#1A1C1B] border border-gold/20 rounded-xl"><span className="text-[9px] text-gold/60 block uppercase">Espécimes</span><span className="text-lg font-serif font-bold text-gold block">{totalSpecimens}</span></div>
                <div className="p-3 bg-[#1A1C1B] border border-gold/20 rounded-xl"><span className="text-[9px] text-gold/60 block uppercase">Incentivos</span><span className="text-lg font-serif font-bold text-gold block">{totalLikes}</span></div>
                <div className="p-3 bg-[#1A1C1B] border border-gold/20 rounded-xl"><span className="text-[9px] text-gold/60 block uppercase">Escolas</span><span className="text-lg font-serif font-bold text-gold block">{distinctGroups}</span></div>
              </div>
            </div>

            <div className="bg-[#141615] border border-gold/20 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-4 shadow-md" id="museum-curator-auth-panel">
              {user ? (
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-full bg-[#1A1C1B] border border-gold flex items-center justify-center text-gold text-xs font-bold uppercase">{user.displayName?.substring(0, 2)}</div>
                  <div className="text-left">
                    <span className="text-[9px] text-gold/70 block uppercase">Investigador</span>
                    <span className="text-xs font-semibold text-slate-200 block">{user.displayName}</span>
                  </div>
                  <button onClick={onSignOut} className="text-[10px] font-mono text-rose-400 hover:text-rose-300 underline uppercase tracking-wider">Sair</button>
                </div>
              ) : (
                <div className="flex flex-wrap items-center gap-3">
                  <div className="text-left text-xs mr-2">
                    <span className="font-semibold text-slate-200 block">Desejas expor um fóssil neste panteão?</span>
                    <span className="text-[10px] text-slate-500 font-mono block">Identifica a tua turma para carregar o teu projeto:</span>
                  </div>
                  {showGuest ? (
                    <form onSubmit={e => { e.preventDefault(); if (guestName.trim()) { onGuestSignIn(guestName.trim()); setShowGuest(false); } }} className="flex items-center gap-1">
                      <input type="text" placeholder="Ex: Turma 7A" value={guestName} onChange={e => setGuestName(e.target.value)} className="px-2 py-1 bg-slate-900 border border-gold/20 rounded text-xs text-white" />
                      <button type="submit" className="px-3 py-1 bg-white text-black text-xs rounded">Entrar</button>
                    </form>
                  ) : (
                    <div className="flex gap-2">
                      <button onClick={onGoogleSignIn} className="px-3 py-1.5 bg-[#1A1C1B] border border-gold/20 hover:bg-gold/10 text-xs font-mono text-slate-200 rounded flex items-center gap-1"><Icon name="log-in" /> Google</button>
                      <button onClick={() => setShowGuest(true)} className="px-3 py-1.5 bg-[#1A1C1B] border border-gold/20 hover:bg-gold/10 text-xs font-mono text-slate-200 rounded flex items-center gap-1"><Icon name="school" /> Turma</button>
                    </div>
                  )}
                </div>
              )}

              <button onClick={onOpenAdd} className="w-full md:w-auto px-6 py-2.5 bg-white hover:bg-gold text-black font-bold font-mono uppercase rounded-lg text-xs flex items-center justify-center gap-1 shadow-md">
                <Icon name="plus" /> Carregar Projeto
              </button>
            </div>

            <div className="flex flex-col md:flex-row items-center justify-between gap-4 bg-[#141615]/50 p-4 border border-gold/15 rounded-xl" id="museum-filters-container">
              <div className="relative w-full md:w-72">
                <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gold/60"><Icon name="search" /></span>
                <input type="text" placeholder="Procurar espécimes..." value={search} onChange={e => setSearch(e.target.value)} className="w-full pl-9 pr-3 py-1.5 bg-[#0F1110] border border-gold/20 rounded-lg text-xs text-white placeholder-slate-600 focus:outline-none" />
              </div>

              <div className="flex overflow-x-auto gap-1 text-xs font-mono">
                {['all', 'Paleozoico', 'Mesozoico', 'Cenozoico'].map(era => (
                  <button key={era} onClick={() => setEraFilter(era)} className={`px-2.5 py-1 rounded-lg ${eraFilter === era ? 'bg-gold/20 text-gold font-bold border border-gold/30' : 'text-slate-400 hover:text-slate-200'}`}>
                    {era === 'all' ? 'Todos' : era}
                  </button>
                ))}
              </div>

              <div className="flex gap-2 text-xs font-mono">
                <button onClick={() => setSort('newest')} className={`flex items-center gap-1 ${sort === 'newest' ? 'text-gold font-bold' : 'text-slate-500'}`}><Icon name="calendar" /> Recentes</button>
                <button onClick={() => setSort('popular')} className={`flex items-center gap-1 ${sort === 'popular' ? 'text-gold font-bold' : 'text-slate-500'}`}><Icon name="trending-up" /> Populares</button>
              </div>
            </div>

            {filtered.length === 0 ? (
              <div className="text-center py-12 border border-gold/10 rounded-xl bg-[#141615]">
                <Icon name="compass" className="w-10 h-10 text-gold/30 mx-auto mb-2 animate-spin" />
                <p className="text-xs text-slate-400">Nenhum espécime encontrado.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="exhibition-cards-grid">
                {filtered.map(ex => (
                  <div key={ex.id} onClick={() => onSelect(ex)} className="group border border-gold/15 hover:border-gold/40 rounded-xl bg-[#141615] overflow-hidden flex flex-col justify-between transition-all hover:-translate-y-1 hover:shadow-xl cursor-pointer duration-200">
                    <div className="h-40 bg-[#0F1110] relative flex items-center justify-center p-4 border-b border-gold/10">
                      <div className="absolute top-3 left-3"><span className="px-2 py-0.5 text-[9px] font-mono bg-gold/10 text-gold border border-gold/20 rounded">{ex.geologicEra}</span></div>
                      <div className="absolute top-3 right-3 text-[10px] font-mono text-slate-300 flex items-center gap-1 bg-black/40 px-2 py-0.5 rounded-full"><Icon name="thumbs-up" className="w-3 h-3 text-gold" /> {ex.likesCount}</div>
                      <span className="text-5xl drop-shadow-[0_0_12px_rgba(194,162,110,0.3)] filter transform transition-transform group-hover:scale-110">
                        {ex.fossilType === 'AMMONITE' && '🐚'}
                        {ex.fossilType === 'TRILOBITE' && '🐜'}
                        {ex.fossilType === 'MEGALODON_TOOTH' && '🦷'}
                        {ex.fossilType === 'LEAF_IMPRINT' && '🌿'}
                        {ex.fossilType === 'AMBER_INSECT' && '💎'}
                        {ex.fossilType === 'DINOSAUR_BONE' && '🦴'}
                      </span>
                    </div>

                    <div className="p-4 flex-grow flex flex-col justify-between space-y-3">
                      <div>
                        <h3 className="text-sm font-serif italic text-white group-hover:text-gold transition-colors">{ex.fossilName}</h3>
                        <p className="text-slate-400 text-xs line-clamp-2 mt-1">{ex.description}</p>
                      </div>
                      <div className="border-t border-gold/10 pt-2 flex justify-between text-[10px] text-slate-500 font-mono">
                        <span className="text-slate-300">Turma: {ex.groupName}</span>
                        <span>{ex.location.split(',')[0]}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      // 6. Global Main Orchestration Shell
      function App() {
        const [exhibits, setExhibits] = useState([]);
        const [selected, setSelected] = useState(null);
        const [showAdd, setShowAdd] = useState(false);
        const [user, setUser] = useState(null);
        const [likedExhibits, setLikedExhibits] = useState([]);

        useEffect(() => {
          // Sync auth state
          if (auth) {
            auth.onAuthStateChanged(fu => {
              if (fu) {
                setUser({ uid: fu.uid, displayName: fu.displayName || 'Estudante', photoURL: fu.photoURL });
              } else {
                const storedGuest = localStorage.getItem('museum_guest_username');
                const storedUid = localStorage.getItem('museum_guest_uid');
                if (storedGuest && storedUid) setUser({ uid: storedUid, displayName: storedGuest });
                else setUser(null);
              }
            });
          }

          // Fetch liked exhibits list
          const l = localStorage.getItem('museum_liked_ids');
          if (l) setLikedExhibits(JSON.parse(l));

          // Sync database Real-Time
          if (db) {
            db.collection('exhibits').onSnapshot(snap => {
              if (snap.empty) {
                PRELOADED_EXHIBITS.forEach(ex => db.collection('exhibits').doc(ex.id).set(ex));
                setExhibits(PRELOADED_EXHIBITS);
              } else {
                const list = [];
                snap.forEach(docSnap => list.push({ id: docSnap.id, ...docSnap.data() }));
                setExhibits(list);
              }
            }, () => loadLocal());
          } else {
            loadLocal();
          }
        }, []);

        const loadLocal = () => {
          const stored = localStorage.getItem('museum_local_exhibits');
          if (stored) {
            setExhibits(JSON.parse(stored));
          } else {
            setExhibits(PRELOADED_EXHIBITS);
            localStorage.setItem('museum_local_exhibits', JSON.stringify(PRELOADED_EXHIBITS));
          }
        };

        const handleSaveLocal = (list) => {
          setExhibits(list);
          localStorage.setItem('museum_local_exhibits', JSON.stringify(list));
        };

        const handleGoogleSignIn = async () => {
          if (!auth) return;
          try {
            const res = await auth.signInWithPopup(googleProvider);
            if (res.user) {
              localStorage.removeItem('museum_guest_username');
              localStorage.removeItem('museum_guest_uid');
            }
          } catch {
            alert('Falha ao entrar com conta Google. Usa Identificar Turma!');
          }
        };

        const handleGuestSignIn = (name) => {
          const uid = 'guest-' + Math.random().toString(36).substring(2, 9);
          localStorage.setItem('museum_guest_username', name);
          localStorage.setItem('museum_guest_uid', uid);
          setUser({ uid, displayName: name });
        };

        const handleSignOut = () => {
          if (auth) auth.signOut();
          localStorage.removeItem('museum_guest_username');
          localStorage.removeItem('museum_guest_uid');
          setUser(null);
        };

        const handleSaveFossil = async (newFossil) => {
          const complete = {
            ...newFossil,
            likesCount: 0,
            createdBy: user ? user.uid : 'anonymous',
            createdAt: new Date().toISOString()
          };
          if (db) {
            try {
              await db.collection('exhibits').add(complete);
            } catch {
              const updated = [...exhibits, { id: 'local-' + Date.now(), ...complete }];
              handleSaveLocal(updated);
            }
          } else {
            const updated = [...exhibits, { id: 'local-' + Date.now(), ...complete }];
            handleSaveLocal(updated);
          }
          setShowAdd(false);
        };

        const handleLike = async (id) => {
          if (likedExhibits.includes(id)) return;
          const updatedLikes = [...likedExhibits, id];
          setLikedExhibits(updatedLikes);
          localStorage.setItem('museum_liked_ids', JSON.stringify(updatedLikes));

          if (db) {
            try {
              await db.collection('exhibits').doc(id).update({ likesCount: firebase.firestore.FieldValue.increment(1) });
            } catch {
              updateLocalLike(id);
            }
          } else {
            updateLocalLike(id);
          }
        };

        const updateLocalLike = (id) => {
          const updated = exhibits.map(ex => ex.id === id ? { ...ex, likesCount: ex.likesCount + 1 } : ex);
          handleSaveLocal(updated);
          if (selected && selected.id === id) {
            setSelected(curr => ({ ...curr, likesCount: curr.likesCount + 1 }));
          }
        };

        return (
          <div id="app-container" className="min-h-screen flex flex-col justify-between">
            <header id="app-header" class="border-b border-gold/20 bg-[#141615] py-4 px-6 shadow-md">
              <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                  <Icon name="landmark" className="w-5 h-5 text-gold" />
                  <div>
                    <h1 class="text-base font-serif italic text-white leading-none">Exposição interativa</h1>
                    <span class="text-[9px] font-mono text-gold/60 uppercase block tracking-widest mt-1">Plataforma virtual de Paleontologia - 2026</span>
                  </div>
                </div>
              </div>
            </header>

            <main class="flex-grow py-4">
              {selected ? (
                <FossilDetailView fossil={selected} onBack={() => setSelected(null)} onLike={handleLike} isLikedByUser={likedExhibits.includes(selected.id)} />
              ) : (
                <MuseumAtrium exhibits={exhibits} onSelect={setSelected} onOpenAdd={() => { if (!user) alert('Identifica o teu grupo escolar primeiro!'); else setShowAdd(true); }} user={user} onGoogleSignIn={handleGoogleSignIn} onGuestSignIn={handleGuestSignIn} onSignOut={handleSignOut} />
              )}
            </main>

            <footer id="app-footer" class="border-t border-gold/15 bg-[#141615]/50 py-4 px-6 text-center shadow-inner">
              <span class="text-[9px] font-mono text-slate-500 uppercase tracking-widest">Plataforma virtual de Paleontologia - 2026</span>
            </footer>

            {showAdd && <AddFossilModal onClose={() => setShowAdd(false)} onSave={handleSaveFossil} />}
          </div>
        );
      }

      // Render App
      const r = ReactDOM.createRoot(document.getElementById('root'));
      r.render(<App />);
    </script>
  </body>
</html>
